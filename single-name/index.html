<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="全国单字地名互动地图｜阿瑟爱地理" />
    <title>全国单字地名｜阿瑟爱地理</title>
    <link rel="icon" href="/avatar.png" />
    <style>
      :root { color-scheme: light; --ink:#183238; --brand:#0d8899; --paper:#fbfaf5; --line:#d8dedc; --muted:#678087; }
      * { box-sizing:border-box; }
      body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.55 "Microsoft YaHei","PingFang SC",Arial,sans-serif; }
      #map { position:fixed; inset:0; z-index:0; }
      .topbar { position:fixed; z-index:3; top:16px; left:16px; right:16px; display:flex; gap:12px; align-items:center; pointer-events:none; }
      .panel { pointer-events:auto; background:rgba(255,255,252,.95); border:1px solid rgba(210,220,217,.9); box-shadow:0 8px 30px rgba(20,45,48,.12); border-radius:14px; }
      .brand { padding:10px 14px; min-width:210px; }
      .brand b { display:block; font-size:17px; letter-spacing:.04em; }
      .brand span { color:var(--muted); font-size:12px; }
      .toolbar { padding:8px; display:flex; gap:7px; align-items:center; flex:1; }
      button, input { font:inherit; }
      button { cursor:pointer; border:1px solid var(--line); color:var(--ink); background:#fff; border-radius:9px; padding:8px 11px; }
      button.active { background:var(--brand); border-color:var(--brand); color:#fff; }
      button:hover { border-color:var(--brand); }
      .homeLink { display:inline-block; padding:8px 10px; border:1px solid var(--line); border-radius:9px; color:var(--ink); text-decoration:none; white-space:nowrap; }
      .homeLink:hover { border-color:var(--brand); color:var(--brand); }
      .search { position:relative; min-width:220px; flex:1; }
      .search input { width:100%; border:1px solid var(--line); border-radius:9px; padding:8px 10px; outline:none; }
      .search input:focus { border-color:var(--brand); box-shadow:0 0 0 3px rgba(13,136,153,.12); }
      #results { position:absolute; top:43px; left:0; right:0; max-height:245px; overflow:auto; background:#fff; border:1px solid var(--line); border-radius:10px; display:none; box-shadow:0 8px 20px rgba(20,45,48,.14); }
      #results button { width:100%; text-align:left; border:0; border-radius:0; padding:8px 10px; }
      #results button:hover { background:#eef8f8; }
      .help { position:fixed; z-index:2; bottom:20px; left:20px; width:min(340px,calc(100vw - 40px)); padding:14px 16px; }
      .help h1 { font-size:17px; margin:0 0 5px; }
      .help p { margin:0; color:#48636a; font-size:13px; }
      #detail { position:fixed; z-index:4; right:20px; bottom:20px; width:min(355px,calc(100vw - 40px)); padding:18px; display:none; }
      #detail.show { display:block; }
      #detail .close { float:right; padding:1px 7px; border:0; font-size:22px; color:#60777d; }
      #detail h2 { margin:0 34px 4px 0; font-size:22px; }
      .mono { color:var(--brand); font-size:34px; font-weight:800; vertical-align:-2px; margin-right:8px; }
      #detail .meta { color:var(--muted); font-size:13px; }
      #detail hr { border:0; border-top:1px solid var(--line); margin:14px 0; }
      #detail .reason { margin:0; line-height:1.8; }
      .no-data { color:#8d6b32; }
      .amap-marker-label, .amap-text { background:transparent!important; border:0!important; }
      @media (max-width:720px) {
        .topbar { top:8px; left:8px; right:8px; flex-wrap:wrap; gap:6px; }
        .brand { min-width:0; padding:8px 10px; }
        .brand b { font-size:15px; } .brand span { display:none; }
        .toolbar { flex:1 1 100%; padding:6px; gap:5px; }
        button { padding:7px 9px; } .search { min-width:140px; }
        .help { display:none; } #detail { right:10px; bottom:10px; width:calc(100vw - 20px); }
      }
    </style>
    <script>window._AMapSecurityConfig={securityJsCode:"0eb2940285ca58de06bc761149917f29"};</script>
    <script src="https://webapi.amap.com/maps?v=2.0&key=95c17505c10a7a11756104750136f562&plugin=AMap.ToolBar"></script>
  </head>
  <body>
    <div id="map" aria-label="全国单字地名地图"></div>
    <header class="topbar">
      <div class="brand panel"><b>全国单字地名</b><span>阿瑟爱地理 · 互动地图专题</span></div>
      <div class="toolbar panel">
        <button id="currentMode" class="active">现在的地名</button>
        <button id="monoMode">单字地名</button>
        <div class="search"><input id="search" autocomplete="off" placeholder="搜索家乡：如 成都 / 蓉" /><div id="results"></div></div>
        <button id="home" title="回到全国视图">全国</button>
        <a class="homeLink" href="/" title="返回阿瑟爱地理主页">← 主页</a>
      </div>
    </header>
    <aside class="help panel"><h1>一座城市，能否只用一个字命名？</h1><p>切换到“单字地名”，点击地图上的文字或行政区，查看该名称的裁定说明。可搜索现名或单字名，寻找你的家乡。</p></aside>
    <aside id="detail" class="panel" aria-live="polite"></aside>
    <script>
      const map = new AMap.Map("map", { zoom: 4, center: [104.2, 35.4], viewMode: "2D", resizeEnable: true });
      AMap.plugin(["AMap.ToolBar"], () => {
        map.addControl(new AMap.ToolBar({ position: { top: "145px", right: "14px" } }));
      });
      let labels = [], shapes = [], features = [], mode = "current";
      const $ = (id) => document.getElementById(id);
      const labelText = (f) => mode === "mono" && f.mono ? f.mono : f.name;
      function labelStyle(f) {
        const isMono = mode === "mono" && f.mono;
        return { padding: isMono ? "1px 4px" : "2px 4px", color: f.status === "matched" ? "#174f58" : "#748286", background: "rgba(255,255,252,.74)", borderRadius: "4px", fontSize: isMono ? "18px" : "12px", fontWeight: isMono ? "700" : "500", whiteSpace: "nowrap", textShadow: "0 1px 1px #fff" };
      }
      function showDetail(f) {
        const noData = f.status !== "matched";
        $("detail").innerHTML = `<button class="close" aria-label="关闭">×</button><h2>${noData ? f.name : `<span class="mono">${f.mono}</span>${f.name}`}</h2><div class="meta">${noData ? "本单元未纳入本专题的单字地名口径" : `${f.province} · ${f.level} · ${f.basis}`}</div><hr><p class="reason ${noData ? "no-data" : ""}">${noData ? "Excel 中没有对应的单字地名裁定记录，因此地图保留现行名称。" : f.reason}</p>`;
        $("detail").classList.add("show");
        $("detail").querySelector(".close").onclick = () => $("detail").classList.remove("show");
      }
      function redraw() {
        map.remove(labels); labels = [];
        for (const f of features) {
          const text = new AMap.Text({ text: labelText(f), position: f.center, anchor: "center", zIndex: 120, style: labelStyle(f) });
          text.on("click", () => showDetail(f)); labels.push(text);
        }
        map.add(labels);
      }
      function selectFeature(f) {
        showDetail(f); map.setZoomAndCenter(7, f.center);
      }
      function search(q) {
        q = q.trim(); const box = $("results");
        if (!q) { box.style.display = "none"; return; }
        const result = features.filter(f => f.name.includes(q) || (f.mono && f.mono.includes(q))).slice(0, 12);
        box.innerHTML = result.map((f, i) => `<button data-i="${i}">${f.name}${f.mono ? ` <b>· ${f.mono}</b>` : ""}<small> ${f.level || "未收录"}</small></button>`).join("") || "<button disabled>没有找到对应行政区</button>";
        box.style.display = "block";
        box.querySelectorAll("button[data-i]").forEach(b => b.onclick = () => { selectFeature(result[+b.dataset.i]); box.style.display = "none"; });
      }
      fetch("/data/single-name-map.json").then(r => r.json()).then(data => {
        features = data.features;
        for (const f of features) for (const ring of f.rings) {
          const polygon = new AMap.Polygon({ path: ring, strokeColor: f.status === "matched" ? "#57818a" : "#9da7a9", strokeWeight: 1, fillColor: f.status === "matched" ? "#c4ded8" : "#d8d8d0", fillOpacity: .18, zIndex: 10 });
          polygon.on("click", () => showDetail(f)); shapes.push(polygon);
        }
        map.add(shapes); redraw();
      }).catch(() => { $("detail").innerHTML = "<h2>地图数据加载失败</h2><p>请刷新页面后重试。</p>"; $("detail").classList.add("show"); });
      $("currentMode").onclick = () => { mode="current"; $("currentMode").classList.add("active"); $("monoMode").classList.remove("active"); redraw(); };
      $("monoMode").onclick = () => { mode="mono"; $("monoMode").classList.add("active"); $("currentMode").classList.remove("active"); redraw(); };
      $("search").addEventListener("input", e => search(e.target.value));
      $("home").onclick = () => { map.setZoomAndCenter(4, [104.2,35.4]); $("detail").classList.remove("show"); };
    </script>
  </body>
</html>
